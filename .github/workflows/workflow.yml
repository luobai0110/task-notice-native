name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "*"

env:
  REGISTRY: registry.cn-chengdu.aliyuncs.com
  REPOSITORY: doomer
  IMAGE_NAME: notiflow

jobs:
  build-native:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Build native runner with Maven
        run: mvn -DskipTests clean package -Pnative -Dquarkus.native.container-build=true

      - name: Generate image tag
        id: tags
        run: |
          IMAGE_FULL_PATH="${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}"
          TAGS="${IMAGE_FULL_PATH}:${{ github.ref_name }}"
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "Generated tags: ${TAGS}"

      - name: Send workflow result (markdown)
        if: always()
        uses: actions/github-script@v7
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          STATUS: ${{ job.status }}
        with:
          script: |
            const url = 'https://notice.yuanzhou.site/api/notice';
            
            const {
              GITHUB_REPOSITORY,
              GITHUB_REF_NAME,
              GITHUB_SHA,
              GITHUB_RUN_ID,
              GITHUB_SERVER_URL
            } = process.env;
            
            const status = process.env.STATUS || 'unknown';
            const tags = process.env.TAGS || 'N/A';
            
            const title = status.toUpperCase();
            
            const message = [
              '## 构建结果',
              '',
              `- **Repository**: \`${GITHUB_REPOSITORY}\``,
              `- **Ref**: \`${GITHUB_REF_NAME}\``,
              `- **Commit**: \`${GITHUB_SHA}\``,
              `- **Tags**: \`${tags}\``,
              '',
              `[查看 Workflow 详情](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})`
            ].join('\n');
            
            const payload = {
              message,
              type: 4,
              title
            };
            
            try {
              await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
              });
            } catch (e) {
              core.warning(`notify error: ${e.message}`);
            }