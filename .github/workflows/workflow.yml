name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "*"

env:
  REGISTRY: registry.cn-chengdu.aliyuncs.com
  REPOSITORY: doomer
  IMAGE_NAME: notiflow

jobs:
  build-native:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Build native runner with Maven
        run: mvn -DskipTests clean package -Pnative -Dquarkus.native.container-build=true

      - name: Generate image tag
        id: tags
        run: |
          IMAGE_FULL_PATH="${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}"
          TAGS="${IMAGE_FULL_PATH}:${{ github.ref_name }}"
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "Generated tags: ${TAGS}"

      - name: Build and push Native image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/main/docker/Dockerfile.native-micro
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.tag=${{ github.ref_name }}
            org.opencontainers.image.type=native
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
      - name: Send workflow result (markdown)
        uses: actions/github-script@v7
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        with:
          script: |
            const core = require('@actions/core');
            const url = 'https://notice.yuanzhou.site/api/notice';
            const lines = [
              '## 构建完成',
              `- Repo: ${process.env.GITHUB_REPOSITORY}`,
              `- Ref: ${process.env.GITHUB_REF_NAME}`,
              `- SHA: ${process.env.GITHUB_SHA}`,
              `- Tags: ${process.env.TAGS}`
            ];
            const payload = { message: lines.join('\n'), type: 4 };
            try {
              const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
              });
              if (!res.ok) core.warning(`notify failed: ${res.status} ${res.statusText}`);
            } catch (e) {
              core.warning(`notify error: ${e.message}`);
            }
      - name: Send workflow result (markdown)
        uses: actions/github-script@v7
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        with:
          script: |
            const core = require('@actions/core');
            const url = 'https://notice.yuanzhou.site/api/notice';
            const lines = [
              '## 构建完成',
              `- Repo: ${process.env.GITHUB_REPOSITORY}`,
              `- Ref: ${process.env.GITHUB_REF_NAME}`,
              `- SHA: ${process.env.GITHUB_SHA}`,
              `- Tags: ${process.env.TAGS}`
            ];
            const payload = { message: lines.join('\n'), type: 4 };
            try {
              const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
              });
              if (!res.ok) core.warning(`notify failed: ${res.status} ${res.statusText}`);
            } catch (e) {
              core.warning(`notify error: ${e.message}`);
            }
